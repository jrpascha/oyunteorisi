# fly.toml app configuration file generated for oyunteorisi on 2026-09-04T19:53:07+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oyunteorisi'
primary_region = 'fra'

[build]

[env]
  LEADERBOARD_DB = '/data/leaderboard.db'
  # Aynı uygulama oyunteorisi.fly.dev, oyunteorisionline.com ve
  # www.oyunteorisionline.com'dan erişilebiliyor. localStorage kökene göre
  # ayrıştığı için hangisinden girildiği takma ad/kimlik çakışmasına yol
  # açabiliyordu — herkes tek adrese yönlendirilir.
  CANONICAL_HOST = 'oyunteorisionline.com'

[mounts]
  source = 'leaderboard_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
